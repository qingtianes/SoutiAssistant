name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle Wrapper
        run: ./gradlew --version

      - name: Run Android Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Run unit tests
        if: ${{ always() }}
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build Debug APK
        if: ${{ always() }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload CI outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-ci-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14
