name: Build Debug APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          android-version: '34'
          components: 'platform-tools,build-tools,ndk'
      # 项目里没 gradlew wrapper，直接装 gradle 到临时目录用系统命令编译
      - name: Install Gradle 8.13
        run: |
          # 加 -v 让 wget 打印下载信息，确认拿到的就是 8.13-bin.zip
          wget -v https://services.gradle.org/distributions/gradle-8.13-bin.zip -O gradle.zip 2>&1 | grep -E "HTTP|saved"
          unzip -o gradle.zip
          # sanity check：解压出来的目录就是 gradle-8.13
          ls -d gradle-8.13 || (echo "UNZIP FAILED" && ls -la && exit 1)
          $RUNNER_TEMP/gradle-8.13/bin/gradle --version
      - name: Disable Aliyun mirror for CI
        run: |
          # 用 @ 作 sed 分隔符（替换内容里没 @，避免 | 跟 sed 分隔符冲突）
          sed -i 's@^        maven { url = uri("https://maven.aliyun.com.*@// CI: aliyun disabled@' settings.gradle.kts
      - name: Build debug APK (multi-ABI)
        # ★ 用绝对路径调 gradle（不用 PATH，避免 Ubuntu 预装 gradle 9.6.1 抢走）
        run: $RUNNER_TEMP/gradle-8.13/bin/gradle assembleDebug --no-daemon
      - name: Upload to v0.5 release (replace old x86_64-only APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5-floatwindow-modules
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-multi-abi
          path: app/build/outputs/apk/debug/app-debug.apk