name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          android-version: '34'
          components: 'platform-tools,build-tools,ndk'
      # 项目里没 gradlew wrapper，直接装 gradle 到临时目录用系统命令编译
      - name: Install Gradle 8.13
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip -O gradle.zip
          unzip -q gradle.zip
          echo "GRADLE_HOME=$RUNNER_TEMP/gradle-8.13" >> $GITHUB_ENV
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> $GITHUB_PATH
          gradle --version
      # ★ 临时屏蔽阿里云镜像（CI 跑的时候 aliyun 502 Bad Gateway，Gradle 把整个 maven 配置 disable，连带官方源也用不了）
      #    CI 在 AWS 用 Google Maven + Maven Central 更快更稳
      #    本地 Windows 不动这个文件，aliyun 镜像照常生效
      - name: Disable Aliyun mirror for CI
        run: sed -i 's|^        maven { url = uri("https://maven.aliyun.com.*|# CI: aliyun disabled|' settings.gradle.kts
      - name: Build debug APK (multi-ABI)
        run: gradle assembleDebug --no-daemon
      - name: Upload to v0.5 release (replace old x86_64-only APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5-floatwindow-modules
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-multi-abi
          path: app/build/outputs/apk/debug/app-debug.apk